<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InvoicePulse</title>
  <link rel="stylesheet" href="style.css">

  <!-- html2pdf Library for PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Chart.js UMD Library for Dashboard Graphs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <div id="toast-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;"></div>
</head>
<body>

  <div class="table-controls" style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
  <input type="text" id="invoice-search" placeholder="Search invoices by client or ID..." style="flex: 1; min-width: 200px;">
  
  <select id="invoice-filter-status" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc;">
    <option value="all">All Statuses</option>
    <option value="paid">Paid</option>
    <option value="pending">Pending</option>
    <option value="overdue">Overdue</option>
  </select>
</div>

  <div id="auth-container" class="auth-container">
    <div class="auth-box">
      <h2 id="auth-title">InvoicePulse</h2>
      <p id="auth-subtitle">Sign in to manage your business</p>
      
      <form id="auth-form">
        <input type="email" id="auth-email" placeholder="Email Address" required />
        <input type="password" id="auth-password" placeholder="Password" required />
        <button type="submit" id="auth-submit-btn">Sign In</button>
      </form>

      <p class="auth-toggle">
        <span id="toggle-text">Don't have an account?</span> 
        <a href="#" id="toggle-auth">Sign Up</a>
      </p>
    </div>
  </div>

  <div id="app-container" class="app-container style-hidden" style="display: none;">
    <aside class="sidebar">
      <h2 class="logo">InvoicePulse</h2>
      <nav class="nav-links">
        <button id="nav-dashboard" class="nav-btn active">Dashboard</button>
        <button id="nav-clients" class="nav-btn">Clients</button>
        <button id="nav-invoices" class="nav-btn">Invoices</button>
        <button id="nav-expenses" class="nav-btn">Expenses</button>
      </nav>
      <button id="logout-btn" class="btn-logout">Log Out</button>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <h1 id="page-title">Dashboard</h1>
        <div class="user-profile">
          <span id="user-email-display"></span>
        </div>
      </header>

      <section id="content-area" class="content-area">
        <!-- Dynamic Module Content Loads Here -->
      </section>
    </main>
  </div>

  <!-- Reusable Modal Window -->
  <div id="modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <h3 id="modal-title">Modal Header</h3>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="btn-secondary">Cancel</button>
        <button id="modal-save-btn" class="btn-primary">Save Changes</button>
      </div>
    </div>
  </div>

  <script type="module" src="supabaseClient.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
